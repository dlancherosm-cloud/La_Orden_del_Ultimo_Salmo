<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conozca</title>
</head>

<body>

<script>
    const contenido = "Folleto";

    const archivo = new Blob([contenido], {
        type: "application/pdf"
    });

    const enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(archivo);
    enlace.download = "Folleto.pdf";

    enlace.click();

    setTimeout(function() {
        window.history.back();
    }, 100);
</script>

</body>
</html>
