    );
const listaConfesiones = document.querySelector(".cajaconfesiones");

async function cargarConfesiones() {

    const { data, error } = await supabaseClient
        .from("confesiones")
        .select("contenido, created_at")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Error al cargar las confesiones:", error);
        return;
    }

    data.forEach(function(confesion) {

        const caja = document.createElement("div");
        caja.classList.add("caja");

        const texto = document.createElement("p");
        texto.textContent = confesion.contenido;

        caja.appendChild(texto);
        listaConfesiones.appendChild(caja);
    });
}

cargarConfesiones();
